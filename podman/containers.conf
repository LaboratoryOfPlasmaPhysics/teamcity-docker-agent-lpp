# Podman inside an unprivileged agent pod (user namespace, no `privileged`).
# The pod's cgroup tree belongs to the node's root, so no cgroups; nested containers share the pod's
# network (no /dev/net/tun needed). IPC stays private: the TeamCity wrapper passes --shm-size.
[containers]
netns = "host"
userns = "host"
ipcns = "private"
utsns = "host"
cgroupns = "host"
cgroups = "disabled"
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
